<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOLO Detection</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="container">
    <h1>YOLO Detection</h1>
    <div class="status">UI build v3</div>
    <form id="detect-form">
      <div class="field">
        <label>File</label>
        <input type="file" id="file" name="file" accept="image/*,video/*" required />
      </div>
      <div class="grid">
        <div class="field">
          <label>Confidence</label>
          <input type="number" step="0.01" min="0" max="1" id="conf" name="conf" value="0.35" />
        </div>
        <div class="field">
          <label>IoU</label>
          <input type="number" step="0.01" min="0" max="1" id="iou" name="iou" value="0.45" />
        </div>
      </div>
      <button type="submit" id="submit">Run Detection</button>
      <div id="status" class="status"></div>
    </form>

    <section>
      <h2>Live Webcam</h2>
      <div class="grid">
        <div class="field">
          <label>Confidence</label>
          <input type="number" step="0.01" min="0" max="1" id="cam-conf" value="0.35" />
        </div>
        <div class="field">
          <label>IoU</label>
          <input type="number" step="0.01" min="0" max="1" id="cam-iou" value="0.45" />
        </div>
      </div>
      <div class="grid">
        <div class="field">
          <label>Device index</label>
          <input type="number" id="cam-device" value="1" min="0" max="3" />
        </div>
      </div>
      <div class="buttons">
        <button type="button" id="start-webcam">Start Webcam</button>
        <button type="button" id="stop-webcam" class="secondary">Stop Webcam</button>
        <!-- No-JS fallback: open stream in a new tab with defaults -->
        <form action="/webcam" method="get" target="_blank" style="display:inline-block;margin-left:8px;">
          <input type="hidden" name="conf" value="0.35" />
          <input type="hidden" name="iou" value="0.45" />
          <input type="hidden" name="device" value="1" />
          <button type="submit" class="secondary">Open stream (new tab)</button>
        </form>
        <a href="/webcam?conf=0.35&iou=0.45&device=1" target="_blank" style="margin-left:8px;">Open stream link</a>
      </div>
      <div id="webcam-wrap" class="card">
        <img id="webcam-stream" alt="Webcam stream will appear here" />
      </div>
    </section>

    <section>
      <h2>Face & Emotion</h2>
      <form id="emotion-form">
        <div class="field">
          <label>Image</label>
          <input type="file" id="emotion-file" name="file" accept="image/*" required />
        </div>
        <div class="field">
          <label>Engine</label>
          <select id="emotion-engine">
            <option value="auto" selected>Auto (ONNX > FER > MediaPipe > Smile)</option>
            <option value="onnx">ONNX (FER+)</option>
            <option value="fer">FER (7 emotions)</option>
            <option value="mp">MediaPipe (heuristic)</option>
            <option value="smile">Smile/Neutral</option>
          </select>
        </div>
        <button type="submit" id="emotion-submit">Analyze Emotion</button>
        <div id="emotion-status" class="status"></div>
      </form>
      <div id="emotion-result"></div>
      <div class="buttons">
        <div class="field">
          <label>Engine</label>
          <select id="emotion-webcam-engine">
            <option value="auto" selected>Auto</option>
            <option value="onnx">ONNX</option>
            <option value="fer">FER</option>
            <option value="mp">MediaPipe</option>
            <option value="smile">Smile</option>
          </select>
        </div>
        <div class="field">
          <label>Device index</label>
          <input type="number" id="emotion-cam-device" value="1" min="0" max="3" />
        </div>
        <button type="button" id="start-emotion-webcam">Start Emotion Webcam</button>
        <button type="button" id="stop-emotion-webcam" class="secondary">Stop</button>
        <!-- No-JS fallback for emotion webcam -->
        <form action="/webcam_emotion" method="get" target="_blank" style="display:inline-block;margin-left:8px;">
          <input type="hidden" name="engine" value="auto" />
          <input type="hidden" name="device" value="1" />
          <button type="submit" class="secondary">Open emotion stream</button>
        </form>
        <a href="/webcam_emotion?engine=auto&device=1" target="_blank" style="margin-left:8px;">Open emotion link</a>
      </div>
      <div class="card" id="emotion-webcam-wrap">
        <img id="emotion-webcam-stream" alt="Emotion webcam stream will appear here" />
      </div>
    </section>

    <section>
      <h2>Result</h2>
      <div id="result"></div>
    </section>

    <section>
      <h2>History</h2>
      <div id="history"></div>
    </section>
  </div>

  <script src="/static/main.js?v=4" defer></script>
</body>
</html>
